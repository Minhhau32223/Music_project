server:
  port: 8000

spring:

  datasource:
    url: jdbc:postgresql://localhost:5432/spotify_clone
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver


  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug
jwt:
  secret: 1234567890123456789012345678901234567890123456789012345678901234
  expiration: 60000
