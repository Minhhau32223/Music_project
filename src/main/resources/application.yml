server:
  port: ${PORT:8000}
  shutdown: graceful
spring:
  application:
    name: music-app-backend
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/music_app}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
  cache:
    type: ${CACHE_TYPE:none}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2s
      timeout: 2s
      ssl:
        enabled: ${REDIS_SSL:false}
      repositories:
        enabled: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:6000000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
auth:
  refresh-cookie:
    secure: ${AUTH_COOKIE_SECURE:false}
    same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
cloudinary:
  cloud_name: ${CLOUDINARY_CLOUD_NAME:}
  api_key: ${CLOUDINARY_API_KEY:}
  api_secret: ${CLOUDINARY_API_SECRET:}
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  seed:
    media:
      enabled: ${MEDIA_SEED_ENABLED:false}
      directory: ${MEDIA_SEED_DIR:}
      image-directory: ${MEDIA_SEED_IMAGE_DIR:}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    redis:
      enabled: false
springdoc:
  paths-to-match: /api/**
  swagger-ui:
    persist-authorization: false
logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
