name: Backend CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: music_app_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d music_app_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/music_app_test
      TEST_DB_USERNAME: postgres
      TEST_DB_PASSWORD: ci-test-only
      TEST_REDIS_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify all tests, package and generate JaCoCo
        run: bash ./mvnw -B -ntp clean verify
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            target/surefire-reports
            target/site/jacoco
      - name: Build Docker image
        run: docker build -t music-backend:ci .
      - name: Smoke test the complete Compose stack
        env:
          DB_PASSWORD: compose-ci-only
          JWT_SECRET: compose-ci-test-only-key-64-characters-long-123456789012345678901234
        run: |
          docker compose up backend --build --wait --wait-timeout 180
          curl --fail http://localhost:8000/actuator/health
          curl --fail http://localhost:8000/api/recommendations/top-songs
          curl --fail http://localhost:8000/api/recommendations/top-songs
          curl --fail http://localhost:8000/v3/api-docs
      - name: Stop Compose services
        if: always()
        env:
          DB_PASSWORD: compose-ci-only
          JWT_SECRET: compose-ci-test-only-key-64-characters-long-123456789012345678901234
        run: docker compose down
