services:
  frontend:
    build:
      context: ../spotify_clone_front
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build: .
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      PORT: 8000
      DB_URL: jdbc:postgresql://postgres_db:5432/music_app
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT_SECRET of at least 64 characters}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-6000000}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CACHE_TYPE: redis
      REDIS_HOST: redis_cache
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      MANAGEMENT_HEALTH_REDIS_ENABLED: "true"
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-false}
      DEV_SEED_PASSWORD: ${DEV_SEED_PASSWORD:-change-me-local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-change-me-local}
      MEDIA_SEED_ENABLED: ${MEDIA_SEED_ENABLED:-false}
      MEDIA_SEED_DIR: ${MEDIA_SEED_DIR:-/seed-media/music}
      MEDIA_SEED_IMAGE_DIR: ${MEDIA_SEED_IMAGE_DIR:-/seed-media/background}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    volumes:
      - ./seed-media:/seed-media:ro
    depends_on:
      postgres_db:
        condition: service_healthy
      redis_cache:
        condition: service_healthy
    restart: unless-stopped
  postgres_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: music_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d music_app"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  redis_cache:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
